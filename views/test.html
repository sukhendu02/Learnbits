<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


       <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
.contest-card {
  background: linear-gradient(135deg, rgba(20, 24, 37, 0.8), rgba(36, 41, 61, 0.9));
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: #fff;
  transition: all 0.3s ease-in-out;
}

.contest-card:hover {
  transform: scale(1.01);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
}

.contest-title {
  font-size: 1.8rem;
  font-weight: 600;
  color: #0ff;
}

.contest-meta {
  font-size: 0.95rem;
  color: #ccc;
}

.contest-desc {
  font-size: 1rem;
  color: #eee;
}

.tag-badge {
  background: rgba(0, 255, 255, 0.1);
  color: #0ff;
  font-size: 0.85rem;
  margin-right: 5px;
  border-radius: 12px;
}

.btn-register {
  background: linear-gradient(135deg, #0ff, #00aaff);
  color: #000;
  border: none;
  transition: 0.3s;
}

.btn-register:hover {
  background: linear-gradient(135deg, #00aaff, #0ff);
  transform: scale(1.05);
}
</style>




</head>
<body>
<!-- Contest Banner -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10">
      <div class="contest-card d-flex flex-column flex-md-row p-4 rounded-4 shadow-lg">
        <div class="flex-grow-1">
          <h2 class="contest-title mb-2">🚀 CodeRush: May Challenge</h2>
          <p class="contest-meta mb-1"><i class="bi bi-calendar-event"></i> 30th May 2025 &nbsp; | &nbsp; <i class="bi bi-clock-history"></i> 90 mins</p>
          <p class="contest-desc my-2">Solve real-world coding problems, compete with top minds, and win rewards! <br><span class="text-success">Top 5 winners earn coins, certificates, and social shoutouts!</span></p>
          <div class="tags mt-2">
            <span class="badge tag-badge">#DSA</span>
            <span class="badge tag-badge">#CodeRush</span>
            <span class="badge tag-badge">#Rewards</span>
          </div>
        </div>
        <div class="align-self-center text-md-end mt-4 mt-md-0 ms-md-4">
          <a href="/register-contest" class="btn btn-register px-4 py-2 fw-bold rounded-pill">Register Now</a>
        </div>
      </div>
    </div>
  </div>
</div>


</body>
</html>
